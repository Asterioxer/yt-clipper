[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-clipper"
version = "0.1.0"
authors = [
  { name="Soham" },
]
description = "100% Free, Local AI YouTube Video Highlight Finder & Clipper powered by Ollama and FFmpeg"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["youtube", "clipper", "highlights", "ollama", "llm", "ffmpeg", "video-editing", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Environment :: Console",
]
dependencies = [
    "yt-dlp>=2026.11.0",
    "youtube-transcript-api>=1.2.5",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.scripts]
clipper = "yt_clipper.cli:main"
yt-clipper = "yt_clipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
